<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyZubster Knowledge Explorer</title>
  <meta name="description" content="Explore all PUBLIC MyZubster knowledge from the Zorgax Knowledge Layer, with verification status clearly shown.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://myzubster-knowledge.vercel.app/knowledge">
  <link rel="alternate" hreflang="it" href="https://myzubster-knowledge.vercel.app/conoscenze">
  <link rel="alternate" hreflang="en" href="https://myzubster-knowledge.vercel.app/knowledge">
  <link rel="stylesheet" href="/knowledge.css">
</head>
<body data-locale="en" data-knowledge-build="2026-09-23-public-v2">
<main>
  <nav class="topbar">
    <a class="brand" href="/">MyZubster Knowledge</a>
    <div class="navlinks">
      <a href="/conoscenze">Italiano</a>
      <a href="https://github.com/danieldirimini-myzubster/myzubster" target="_blank" rel="noopener noreferrer">Repository</a>
    </div>
  </nav>

  <header class="hero">
    <div>
      <div class="eyebrow">Zorgax Knowledge Layer</div>
      <h1>Public Knowledge Explorer</h1>
      <p>Browse all public MyZubster knowledge. Provenance, versioning, evidence, lineage and verification status remain visible on each record.</p>
    </div>
    <div class="trust">PUBLIC knowledge · status shown</div>
  </header>

  <section class="controls" aria-label="Knowledge search">
    <input id="search" type="search" placeholder="Search title, description, category, source or evidence…">
    <button id="searchButton">Search</button>
  </section>

  <section class="statusline">
    <span id="status">Loading public knowledge…</span>
  </section>

  <section id="records" class="grid" aria-live="polite"></section>
</main>
<script src="/knowledge-app.js" defer></script>
</body>
</html>
