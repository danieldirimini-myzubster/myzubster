<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Profilo professionale pubblico su MyZubster">
<title>Profilo professionale · MyZubster</title>
<style>
:root{color-scheme:dark;--bg:#07101f;--card:#0d1726;--line:#26364b;--text:#f8fafc;--muted:#aebdca;--accent:#7dd3fc;--ok:#86efac}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#10213b 0,#07101f 42%,#050914 100%);color:var(--text);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:42px 18px 80px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.02em}.brand a{color:var(--text);text-decoration:none}.badge{font-size:13px;border:1px solid #31506b;background:#0a1a2b;padding:7px 10px;border-radius:999px;color:var(--accent)}
.hero,.card{background:rgba(13,23,38,.94);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.hero{padding:28px}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 14px}.hero p{font-size:18px;line-height:1.65;color:var(--muted);margin:0}
.meta{margin-top:18px;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:16px}.card{padding:22px;grid-column:span 12}
@media(min-width:760px){.half{grid-column:span 6}}h2{margin:0 0 16px;font-size:21px}.items{display:grid;gap:12px}.item{padding:14px;border:1px solid #203047;border-radius:14px;background:#091421}
.item strong{display:block;font-size:16px}.small{margin-top:5px;color:var(--muted);font-size:14px;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #31506b;background:#0a1a2b;padding:7px 10px;border-radius:999px;color:#d7e8f5;font-size:13px}
.evidence a{color:var(--accent)}.status{padding:28px;text-align:center;color:var(--muted)}.error{color:#fecaca}.footer{text-align:center;color:#7890a6;font-size:13px;margin-top:24px}.footer a{color:var(--accent)}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div class="brand"><a href="/">MyZubster</a></div>
    <div class="badge">Profilo professionale pubblico</div>
  </div>

  <section class="hero" id="hero">
    <div class="status" id="status">Caricamento del profilo…</div>
  </section>

  <div class="grid" id="content" hidden>
    <section class="card" id="skillsCard"><h2>Competenze</h2><div class="items" id="skills"></div></section>
    <section class="card" id="experiencesCard"><h2>Esperienze</h2><div class="items" id="experiences"></div></section>
    <section class="card half" id="interestsCard"><h2>Interessi</h2><div class="chips" id="interests"></div></section>
    <section class="card half" id="goalsCard"><h2>Obiettivi</h2><div class="items" id="goals"></div></section>
    <section class="card half" id="collaborationCard"><h2>Disponibilità a collaborare</h2><div class="small" id="collaboration"></div></section>
    <section class="card half evidence" id="evidenceCard"><h2>Evidenze</h2><div class="items" id="evidence"></div></section>
  </div>

  <div class="footer">Profilo pubblicato dall'utente su <a href="/">MyZubster</a>.</div>
</main>
<script>
(()=>{
  const pathParts=location.pathname.split('/').filter(Boolean);
  const username=pathParts[0]==='profile'&&pathParts[1]?decodeURIComponent(pathParts[1]):new URLSearchParams(location.search).get('username');
  const status=document.getElementById('status'),hero=document.getElementById('hero'),content=document.getElementById('content');

  const text=(tag,value,className)=>{const el=document.createElement(tag);if(className)el.className=className;el.textContent=value||'';return el;};
  const hideIfEmpty=(id,hasContent)=>{document.getElementById(id).hidden=!hasContent;};

  function render(profile,publicUsername){
    status.remove();
    const h1=text('h1',profile.headline||publicUsername||'Profilo professionale');
    const summary=text('p',profile.summary||'');
    hero.append(h1);
    if(profile.summary)hero.append(summary);
    const meta=text('div','@'+publicUsername,'meta');hero.append(meta);

    const skills=Array.isArray(profile.skills)?profile.skills:[];
    const skillsEl=document.getElementById('skills');
    skills.forEach(skill=>{
      const box=text('div','', 'item');
      box.append(text('strong',skill.name));
      const detail=[skill.experience,skill.level?('Livello: '+skill.level):''].filter(Boolean).join(' · ');
      if(detail)box.append(text('div',detail,'small'));
      if(Array.isArray(skill.evidence)&&skill.evidence.length)box.append(text('div','Evidenze: '+skill.evidence.join(' · '),'small'));
      if(skill.notes)box.append(text('div',skill.notes,'small'));
      skillsEl.append(box);
    });
    hideIfEmpty('skillsCard',skills.length);

    const experiences=Array.isArray(profile.experiences)?profile.experiences:[];
    const expEl=document.getElementById('experiences');
    experiences.forEach(exp=>{
      const box=text('div','', 'item');
      box.append(text('strong',exp.title));
      const line=[exp.organization,exp.duration].filter(Boolean).join(' · ');
      if(line)box.append(text('div',line,'small'));
      if(exp.description)box.append(text('div',exp.description,'small'));
      if(Array.isArray(exp.evidence)&&exp.evidence.length)box.append(text('div','Evidenze: '+exp.evidence.join(' · '),'small'));
      expEl.append(box);
    });
    hideIfEmpty('experiencesCard',experiences.length);

    const interests=Array.isArray(profile.interests)?profile.interests:[];
    const intEl=document.getElementById('interests');
    interests.forEach(v=>intEl.append(text('span',v,'chip')));
    hideIfEmpty('interestsCard',interests.length);

    const goals=Array.isArray(profile.goals)?profile.goals:[];
    const goalsEl=document.getElementById('goals');
    goals.forEach(v=>goalsEl.append(text('div',v,'item')));
    hideIfEmpty('goalsCard',goals.length);

    const collaboration=profile.collaborationAvailability||'';
    document.getElementById('collaboration').textContent=collaboration;
    hideIfEmpty('collaborationCard',Boolean(collaboration));

    const evidence=Array.isArray(profile.evidence)?profile.evidence:[];
    const evidenceEl=document.getElementById('evidence');
    evidence.forEach(ev=>{
      const box=text('div','', 'item');
      box.append(text('strong',ev.source||'Evidenza'));
      if(ev.description)box.append(text('div',ev.description,'small'));
      if(ev.url){const a=document.createElement('a');a.href=ev.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Apri evidenza';box.append(a);}
      evidenceEl.append(box);
    });
    hideIfEmpty('evidenceCard',evidence.length);

    document.title=(profile.headline||publicUsername)+' · MyZubster';
    content.hidden=false;
  }

  async function load(){
    if(!username){status.className='status error';status.textContent='Username non specificato.';return;}
    try{
      const res=await fetch('/api/users/'+encodeURIComponent(username)+'/professional-profile',{headers:{Accept:'application/json'}});
      const data=await res.json();
      if(!res.ok||!data.success)throw new Error(data.message||'Profilo pubblico non disponibile');
      render(data.data.profile,data.data.username||username);
    }catch(error){
      status.className='status error';
      status.textContent=error.message||'Impossibile caricare il profilo.';
    }
  }
  load();
})();
</script>
</body>
</html>
